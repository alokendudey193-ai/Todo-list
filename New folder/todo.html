
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Todo List</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 50px 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;

            margin-top: 0;

            color: #333;
        }

        /* ADD TASK */

        .input-group {
            display: flex;

            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px 0 0 6px;

            font-size: 15px;

            outline: none;
        }

        #taskInput:focus {
            border-color: #28a745;
        }

        .add-btn {
            padding: 12px 18px;

            border: none;

            background: #28a745;

            color: white;

            cursor: pointer;

            border-radius: 0 6px 6px 0;

            font-weight: bold;
        }

        .add-btn:hover {
            background: #218838;
        }

        /* LOADING */

        #loading {
            display: none;

            text-align: center;

            color: #777;

            font-size: 14px;
        }

        /* TASK LIST */

        #taskList {
            list-style: none;

            padding: 0;

            margin: 0;
        }

        .task-item {
            background: #f8f9fa;

            margin-bottom: 10px;

            padding: 12px;

            border-radius: 7px;

            display: flex;

            align-items: center;

            gap: 10px;

            border-left: 5px solid #28a745;
        }

        .task-text {
            flex: 1;

            word-break: break-word;
        }

        /* BUTTONS */

        .button-group {
            display: flex;

            gap: 5px;
        }

        button {
            cursor: pointer;
        }

        .complete-btn {
            background: #007bff;

            color: white;

            border: none;

            padding: 7px 10px;

            border-radius: 4px;

            font-size: 12px;
        }

        .complete-btn:hover {
            background: #0056b3;
        }

        .delete-btn {
            background: #dc3545;

            color: white;

            border: none;

            padding: 7px 10px;

            border-radius: 4px;

            font-size: 12px;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        /* COMPLETED */

        .completed {
            background: #eeeeee;

            border-left-color: #999;
        }

        .completed .task-text {
            text-decoration: line-through;

            color: #777;
        }

        /* EMPTY */

        .empty {
            text-align: center;

            color: #888;

            padding: 20px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .container {
                padding: 20px;
            }

            .task-item {
                flex-direction: column;

                align-items: stretch;
            }

            .button-group {
                justify-content: flex-end;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h2>My To-Do List</h2>


        <!-- ADD TASK -->

        <div class="input-group">

            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
            >

            <button
                class="add-btn"
                onclick="addTask()"
            >
                Add
            </button>

        </div>


        <!-- LOADING -->

        <p id="loading">
            Syncing with Google Sheets...
        </p>


        <!-- TASKS -->

        <ul id="taskList"></ul>

    </div>


    <script>

        // ==========================================
        // GOOGLE APPS SCRIPT URL
        // ==========================================

        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbxUBiPs7mKr74DiyZVPvJrjqsOI-AxyM-Zfmh9ql78bXXaRdV2fyYB9V3tjsyt-shhK/exec";


        const taskInput =
            document.getElementById("taskInput");

        const taskList =
            document.getElementById("taskList");

        const loading =
            document.getElementById("loading");


        // ==========================================
        // PAGE LOAD
        // ==========================================

        window.onload = function () {

            loadTasks();

        };


        // ==========================================
        // LOAD TASKS
        // ==========================================

        function loadTasks() {

            loading.style.display = "block";

            taskList.innerHTML = "";


            fetch(SCRIPT_URL)

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to load tasks"
                        );

                    }

                    return response.json();

                })

                .then(data => {

                    loading.style.display = "none";


                    if (!data || data.length === 0) {

                        taskList.innerHTML =
                            '<li class="empty">No tasks yet.</li>';

                        return;

                    }


                    data.forEach(task => {

                        createTask(
                            task.id,
                            task.task,
                            task.status
                        );

                    });

                })

                .catch(error => {

                    loading.style.display = "none";

                    console.error(
                        "Load error:",
                        error
                    );

                    taskList.innerHTML =
                        '<li class="empty">Unable to load tasks.</li>';

                });

        }


        // ==========================================
        // ADD TASK
        // ==========================================

        function addTask() {

            const task =
                taskInput.value.trim();


            if (task === "") {

                alert(
                    "Please enter a task."
                );

                return;

            }


            loading.style.display = "block";


            fetch(SCRIPT_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body: JSON.stringify({

                    action: "add",

                    task: task

                })

            })

            .then(response => {

                return response.json();

            })

            .then(data => {

                console.log(
                    "Add response:",
                    data
                );

                taskInput.value = "";

                loadTasks();

            })

            .catch(error => {

                loading.style.display = "none";

                console.error(
                    "Add error:",
                    error
                );

                alert(
                    "Unable to add task."
                );

            });

        }


        // ==========================================
        // COMPLETE TASK
        // ==========================================

        function completeTask(id) {

            loading.style.display = "block";


            fetch(SCRIPT_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body: JSON.stringify({

                    action: "complete",

                    id: id

                })

            })

            .then(response => {

                return response.json();

            })

            .then(data => {

                console.log(
                    "Complete response:",
                    data
                );

                loadTasks();

            })

            .catch(error => {

                loading.style.display = "none";

                console.error(
                    "Complete error:",
                    error
                );

                alert(
                    "Unable to complete task."
                );

            });

        }


        // ==========================================
        // DELETE TASK
        // ==========================================

        function deleteTask(id, taskElement) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this task?"
                );


            if (!confirmDelete) {

                return;

            }


            loading.style.display = "block";


            fetch(SCRIPT_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body: JSON.stringify({

                    action: "delete",

                    id: id

                })

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Delete request failed"
                    );

                }

                return response.json();

            })

            .then(data => {

                console.log(
                    "Delete response:",
                    data
                );


                // ==================================
                // REMOVE TASK FROM SCREEN
                // ==================================

                taskElement.remove();


                loading.style.display = "none";


                // ==================================
                // SHOW EMPTY MESSAGE
                // ==================================

                if (taskList.children.length === 0) {

                    taskList.innerHTML =
                        '<li class="empty">No tasks yet.</li>';

                }

            })

            .catch(error => {

                loading.style.display = "none";

                console.error(
                    "Delete error:",
                    error
                );

                alert(
                    "Unable to delete task."
                );

            });

        }


        // ==========================================
        // CREATE TASK UI
        // ==========================================

        function createTask(
            id,
            taskText,
            status
        ) {

            const li =
                document.createElement("li");


            li.className =
                "task-item";


            // ==================================
            // TASK TEXT
            // ==================================

            const span =
                document.createElement("span");


            span.className =
                "task-text";


            span.textContent =
                taskText;


            li.appendChild(span);


            // ==================================
            // BUTTON GROUP
            // ==================================

            const buttonGroup =
                document.createElement("div");


            buttonGroup.className =
                "button-group";


            // ==================================
            // COMPLETE BUTTON
            // ==================================

            if (status !== "completed") {

                const completeButton =
                    document.createElement("button");


                completeButton.className =
                    "complete-btn";


                completeButton.textContent =
                    "✔ Complete";


                completeButton.onclick =
                    function () {

                        completeTask(id);

                    };


                buttonGroup.appendChild(
                    completeButton
                );

            }


            // ==================================
            // DELETE BUTTON
            // ==================================

            const deleteButton =
                document.createElement("button");


            deleteButton.className =
                "delete-btn";


            deleteButton.textContent =
                "🗑 Delete";


            deleteButton.onclick =
                function () {

                    // Pass the task element
                    // to the delete function

                    deleteTask(
                        id,
                        li
                    );

                };


            buttonGroup.appendChild(
                deleteButton
            );


            li.appendChild(
                buttonGroup
            );


            // ==================================
            // COMPLETED STYLE
            // ==================================

            if (status === "completed") {

                li.classList.add(
                    "completed"
                );

            }


            taskList.appendChild(li);

        }


        // ==========================================
        // ENTER KEY = ADD TASK
        // ==========================================

        taskInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    addTask();

                }

            }
        );

    </script>

</body>

</html>
